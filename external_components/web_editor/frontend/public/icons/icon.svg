<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d2b43"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d62828"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <!-- Outer ring (timer) -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="1507.96" stroke-dashoffset="226"/>
  <!-- Stone body -->
  <ellipse cx="256" cy="280" rx="120" ry="100" fill="url(#stoneGrad)"/>
  <!-- Stone handle -->
  <path d="M256 200 Q340 220 360 280 Q340 340 256 360" fill="none" stroke="#06141f" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
  <!-- Handle highlight -->
  <path d="M256 200 Q320 210 330 260" fill="none" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <!-- Timer center dot -->
  <circle cx="256" cy="256" r="12" fill="#d62828"/>
</svg>
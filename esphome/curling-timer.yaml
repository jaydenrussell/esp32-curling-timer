# =====================================================================
# ESP32 Curling Timer
# M5Stack Unit PoE-P4 (U213) + Add-On Display Out LT8912B HDMI (U221)
# + M5Stack Unit 2Relay (HY2.0-4P, GPIO control) + ESP32-C6 (SuperMini)
#   SDIO co-processor for Wi-Fi 6
#
# Port of the rpi-buzzer / pitimer firmware (v2.4.4) to ESPHome.
#
# v0 bring-up: stock components only (compiles clean, no custom code).
# Display / schedule-engine / web-editor arrive via external_components/
# and are enabled by uncommenting the marked WIP blocks below.
# =====================================================================

substitutions:
  # IANA timezone, e.g. "America/New_York" — see docs/BUILD.md
  timezone: "Etc/GMT"

esphome:
  name: curling-timer
  friendly_name: Curling Timer
  name_add_mac_suffix: false

esp32:
  variant: esp32p4
  # First bench boot showed "Chip Revision: 103" (v1.3) — pre-rev3
  # engineering sample silicon; required so the build targets rev<3.0
  engineering_sample: true
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 200MHz

logger:
  # USB Serial/JTAG on the U213 USB-C port is the bench console.
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

# ---------------------------------------------------------------------
# Networking: PoE Ethernet is the default and only requirement.
# Wi-Fi (via the C6 SDIO co-processor) is an OPTIONAL add-on package —
# add it only when the SuperMini C6 is wired and flashed:
#
# packages:
#   wifi_addon: !include wifi-c6-failover.yaml
# ---------------------------------------------------------------------
ethernet:
  # M5Stack Unit PoE-P4: PHY IP101GRI @ address 1
  type: IP101
  phy_addr: 1
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  # RMII 50MHz reference clock is fed in from the board's clock circuit
  clk_mode: GPIO0_IN

# ---------------------------------------------------------------------
# Link diagnostics — which network path is actually up.
# Ethernet is primary whenever its link is connected; Wi-Fi (C6) is
# failover; the AP hotspot is last-resort.
# ---------------------------------------------------------------------
binary_sensor:
  - platform: template
    name: "Ethernet Connected"
    id: ethernet_up
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return ethernet::global_eth_component->is_connected();

# ---------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------
ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  auth:
    # digest avoids sending the password over the network in a
    # reversible form (ESPHome deprecates basic in 2027.1)
    type: digest
    username: admin
    password: !secret web_password

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - time.cloudflare.com
      - pool.ntp.org
    on_time_sync:
      then:
        - logger.log: "Time synchronized"

# ---------------------------------------------------------------------
# M5Stack Unit 2Relay — wired to Grove Port B (HY2.0-4P: G53, G54, 5V, GND)
# Manual LED-on = relay closed. Drives the 24VAC bell circuit.
# ---------------------------------------------------------------------
switch:
  - platform: gpio
    name: "Bell Relay 1"
    id: relay_bell_ring
    pin: GPIO53
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "Bell Relay 2"
    id: relay_aux
    pin: GPIO54
    restore_mode: RESTORE_DEFAULT_OFF

# ---------------------------------------------------------------------
# Diagnostics
# ---------------------------------------------------------------------
text_sensor:
  - platform: version
    name: "Firmware Version"

sensor:
  - platform: uptime
    name: "Uptime"

# =====================================================================
# WIP — enable as external_components land (in implementation order):
#
# 1. LT8912B HDMI display driver (1280x720@60 via MIPI-DSI):
# external_components:

# =====================================================================
# ESP32 Curling Timer
# M5Stack Unit PoE-P4 (U213) + Add-On Display Out LT8912B HDMI (U221)
# + M5Stack Unit 2Relay (HY2.0-4P, GPIO control) + ESP32-C6 (SuperMini)
#   SDIO co-processor for Wi-Fi 6
#
# Port of the rpi-buzzer / pitimer firmware (v2.4.4) to ESPHome.
#
# Schedule engine + web editor + LT8912B HDMI display + LVGL countdown
# UI are enabled below (external_components).
#
# Optional hardware add-ons live in esphome/addons/ and are wired in via
# `packages:` — e.g.:
#
#   packages:
#     i2c_hub: !include addons/i2c_hub_pahub.yaml   # PaHub v2.1 on Grove Port B
#     rtc_addon: !include addons/rtc_addon.yaml     # M5Stack RTC Unit (HYM8563), SKU U126
#     wifi_addon: !include wifi-c6-failover.yaml    # ESP32-C6 SDIO Wi-Fi
#
# Uncomment only the hardware you have wired. Each add-on is self-contained;
# leaving it out keeps the build lean. Verify pins against docs/wiring-U213.md.
# =====================================================================

substitutions:
  # IANA timezone, e.g. "America/New_York" — see docs/BUILD.md
  timezone: "America/Toronto"

esphome:
  name: curling-timer
  friendly_name: Curling Timer
  name_add_mac_suffix: false

esp32:
  variant: esp32p4
  watchdog_timeout: 60s
  # First bench boot showed "Chip Revision: 103" (v1.3) on the U213 —
  # pre-rev3 silicon; required so the build targets rev<3.0
  engineering_sample: true
  cpu_frequency: 360MHz
  flash_size: 16MB
  # Un-cap the flash SPI: left unset, ESP-IDF/board default is DIO@40MHz.
  # P4 FLASH SPI supports up to 120MHz SDR; this module's flash runs
  # QIO@60MHz (4-bit mode -> ~240Mbps, faster than factory DIO@80).
  flash_mode: qio
  flash_frequency: 60MHz
  framework:
    type: esp-idf
    # The settings store keeps timestamped backups in a "backups" folder and
    # lists them for the web editor. ESP-IDF's VFS only provides opendir/
    # readdir/mkdir when this is on (otherwise newlib's always-fail stubs are
    # linked and every save fails with "cannot create backup directory").
    #
    # Long file names: ESPHome's generated sdkconfig leaves FATFS with
    # LFN_NONE, so only 8.3 names can be created and
    # "pitimer_settings.yml" fails with FR_INVALID_NAME. LFN_HEAP enables
    # them (the LFN buffer is ~300 bytes per open file).
    sdkconfig_options:
      CONFIG_VFS_SUPPORT_DIR: y
      CONFIG_FATFS_LFN_HEAP: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      # Enable malloc to fall back to PSRAM when internal heap is exhausted
      CONFIG_SPIRAM_USE_MALLOC: y
      # Persist crash diagnostics to flash for post-mortem analysis.
      CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH: y
      CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF: y
      CONFIG_ESP_COREDUMP_CHECKSUM_CRC32: y
      # Raise HTTP server request limits (ESPHome web_server/port 80 and global
      # esp_http_server defaults) so reverse-proxy headers/cookies don't trigger
      # "431 Request Header Fields Too Large" behind Zoraxy.
      CONFIG_HTTPD_MAX_REQ_HDR_LEN: "4096"
      CONFIG_HTTPD_MAX_URI_LEN: "1024"
      # Enable mbedtls certificate bundle so esp_http_client can verify
      # HTTPS server certificates (used by server-side league import).
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: y
    advanced:
      execute_from_psram: true
      # The 1 Hz display tick (display_snapshot + LVGL label updates + recolor)
      # runs on the ESPHome loop task. A loopTask stack overflow crashed the
      # device ~6 min into a run; max out the loop task stack (default 8192).
      loop_task_stack_size: 32768

psram:
  # ESP32-P4 only supports hex mode in ESPHome (2026.9.1)
  speed: 100MHz

safe_mode:
  disabled: true

logger:
  # USB Serial/JTAG on the U213 USB-C port is the bench console.
  hardware_uart: USB_SERIAL_JTAG
  # INFO for production; VERBOSE only while bench-debugging (select below can
  # raise it at runtime without a reflash).
  level: INFO
  task_log_buffer_size: 8192

select:
  - platform: logger
    name: "Log Level"
    id: log_level_select

json:

# ---------------------------------------------------------------------
# Networking: PoE Ethernet is the default and only requirement.
# Wi-Fi (via the C6 SDIO co-processor) is an OPTIONAL add-on package —
# add it only when the SuperMini C6 is wired and flashed:
#
# packages:
#   wifi_addon: !include wifi-c6-failover.yaml
# ---------------------------------------------------------------------
network:

ethernet:
  # M5Stack Unit PoE-P4: PHY IP101GRI @ address 1 (per M5Stack U213 pin map)
  # RXDV=G28 RXD0=G29 RXD1=G30 TXD0=G34 TXD1=G35 TXEN=G49 RMII_CLK=G50
  type: IP101
  phy_addr: 1
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    pin: GPIO50
    mode: CLK_EXT_IN
# ---------------------------------------------------------------------
# mDNS - advertises the device as curling-timer.local on the local
# network, so Home Assistant can discover it and the device can be
# reached by name (http://curling-timer.local:8080 for the web editor).
# The hostname follows the device name above.
# ---------------------------------------------------------------------
mdns:
  id: mdns_advertiser

# ---------------------------------------------------------------------
# Link diagnostics — which network path is actually up.
# Ethernet is primary whenever its link is connected; Wi-Fi (C6) is
# failover; the AP hotspot is last-resort.
# ---------------------------------------------------------------------
binary_sensor:
  - platform: template
    name: "Ethernet Connected"
    id: ethernet_up
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return ethernet::global_eth_component->is_connected();

  # Manual push-button trigger for scheduled games that overrun. Wired to
  # GPIO45 (KEY_USER per the U213 wiring doc). A press asks the engine to
  # ring the start relays for the next scheduled game with manual_trigger
  # == true (default: games starting 17:00 or later).
  - platform: gpio
    pin:
      number: GPIO45
      mode: INPUT_PULLUP
    name: "Manual Trigger Button"
    id: manual_trigger_btn
    on_press:
      - lambda: id(engine).request_manual_trigger();

# ---------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------
# Native API - encrypted. The key is a 32-byte base64 secret; without
# it the API speaks plaintext and anyone on the network can drive the
# device. Generate with: openssl rand -base64 32
api:
  reboot_timeout: 0s
  encryption:
    key: !secret curling_timer__encryption_key

# # Over-the-air updates - encrypted, so a firmware image cannot be pushed
# # or installed by anyone who only has network access. The key also
# # authenticates the uploader, so no separate password is used (ESPHome
# # refuses password + encryption together). ESPHome requires the OTA key
# # to be the API key, so both use the same secret.
http_request:
  verify_ssl: true
  buffer_size_rx: 5120
  buffer_size_tx: 5120

ota:
  - platform: esphome
  - platform: web_server
    id: web_ota
  - platform: http_request
    id: http_ota

# update:
#   The http_request update platform crashes on ESP32-P4 when HTTPS/TLS fails
#   (esp_transport_list_clean aborts via unhandled C++ exception).
#   Use the native ESPHome OTA platform instead (encrypted, same API key).
#   - platform: http_request
#     name: "Firmware Update"
#     id: firmware_update
#     source: https://github.com/jaydenrussell/esp32-curling-timer/releases/latest/download/manifest.json
#     update_interval: 6h

web_server:
  port: 80
  log: true
  auth:
    # digest avoids sending the password in a reversible form
    # (ESPHome deprecates basic auth in 2027.1)
    type: digest
    username: admin
    password: !secret webui_password

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    # NOTE: daily sync trades lower network traffic for larger clock drift
    # between syncs. For minimal drift use a shorter interval (e.g. 5min).
    update_interval: 24h
    servers:
      - time.cloudflare.com
      - pool.ntp.org
    on_time_sync:
      then:
        - logger.log: "Time synchronized"

# ---------------------------------------------------------------------
# Add-on UART0 on the Hat2-Bus — GPIO37 TX / GPIO38 RX (pins 5 / 4).
# Compiled in so the engine can stream a one-line status to a serial
# device when config.addons.uart is true (toggled live from the web UI).
# Wires under 5cm, grounds common — see docs/wiring-U213.md.
# ---------------------------------------------------------------------
uart:
  - id: uart_addon
    tx_pin: GPIO37
    rx_pin:
      number: GPIO38
      mode: INPUT_PULLUP
    baud_rate: 115200

# ---------------------------------------------------------------------
# M5Stack Unit 2Relay — wired to Grove Port B (HY2.0-4P: G53, G54, 5V, GND)
# Manual LED-on = relay closed. Drives the 24VAC bell circuit.
# Both channels are manual HA toggles; the schedule engine drives them
# from the settings file (web editor Config tab, "Bell / buzzer"):
#   buzzer.relays            - relays that ring at the buzzer time
#   buzzer.ring_at_start     - relays that ring when a game starts
#   buzzer.countdown         - {minutes_before: N, relays: [...]} warning
#   buzzer.duration          - ring length in seconds (all events)
# Each event rings once per game; empty relay lists turn an event off.
# restore_mode ALWAYS_OFF matches pitimer's reset_buzzer(): never leave
# a relay energised across reboot.
# ---------------------------------------------------------------------
switch:
  - platform: gpio
    name: "Relay 1 (Bell)"
    id: relay_bell_ring
    pin: GPIO53
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relay 2 (Aux)"
    id: relay_aux
    pin: GPIO54
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------
# Diagnostics
# ---------------------------------------------------------------------
text_sensor:
  - platform: version
    name: "Firmware Version"

sensor:
  - platform: uptime
    name: "Uptime"

# ---------------------------------------------------------------------
# Schedule engine + web editor + LT8912B (external_components).
#
# Git source works for both repo/CI builds and HA Device Builder.
# The ref is tracked in component_ref.txt and updated when component
# code changes (see AGENTS.md for details).
# ---------------------------------------------------------------------
external_components:
  - source:
      type: git
      url: https://github.com/jaydenrussell/esp32-curling-timer
      ref: v2026.11.241
      path: external_components   # required: ESPHome only auto-scans
                                  # components/ and esphome/components/
    components: [curling_engine, web_editor, lt8912b]
    refresh: 0s

curling_engine:
  id: engine
  store_path: /flash
  uart_id: uart_addon

web_editor:
  # The "Web Editor" diagnostic entity (listening on port 8080 / the
  # reason it is not) is created by the component itself, so this file
  # never calls component APIs - a cached (older) clone of the external
  # component can then never break the build.
  id: web_editor_comp
  password: !secret webui_password
  port: 8080

# ---------------------------------------------------------------------
# HDMI display: M5Stack Add-On Display Out LT8912B (U221), 1280x720@60.
# esp_ldo powers the MIPI-DSI PHY (channel 3 @ 2.5V per M5GFX U221) —
# lt8912b depends on it. The LVGL page below drives the pixels; without
# an lvgl: block this component would show the ESPHome test card instead.
# ---------------------------------------------------------------------
esp_ldo:
  - channel: 3
    voltage: 2.5V

lt8912b:
  id: hdmi
  reset_pin: GPIO4
  enable_pin: GPIO33
  sda_pin: GPIO0
  scl_pin: GPIO1

# ---------------------------------------------------------------------
# Fonts - Lato Bold (static TTF from google/fonts, fetched once per
# build and cached). Lato ships U+02F8, the modifier letter raised
# colon pitimer uses instead of ':'.
#
# Sizes are measured off the pitimer reference screen (1280x720): the
# header text spans ~95% of the width, the 5-digit timer ~93%, the
# pace line ~80% and the footer date ~22%.
#   header 96   timer 5 digits 370   timer 4 digits 450
#   pace 85     footer 52
# The 4-digit timer is larger than the 5-digit one (as in pitimer:
# 992 vs 816) because it has fewer glyphs to fit across the width.
# ---------------------------------------------------------------------
font:
  - file: "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf"
    id: font_timer_4
    size: 450
    glyphs: ["0123456789", ":", "\u02F8"]
  - file: "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf"
    id: font_timer_5
    size: 370
    glyphs: ["0123456789", ":", "\u02F8"]
  - file: "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf"
    id: font_header
    size: 96
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["\u02F8"]
  - file: "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf"
    id: font_pace
    size: 85
    glyphsets: [GF_Latin_Kernel]
  - file: "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf"
    id: font_footer
    size: 52
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["\u02F8"]

# Latest display snapshot from CurlingEngineComponent::display_snapshot()
# (the pitimer draw_screen data prep), written once per second below.
globals:
  - id: g_snap
    type: ::esphome::curling_engine::DisplaySnapshot
    restore_value: no
  - id: pregame_blink_on
    type: bool
    restore_value: no
    initial_value: "true"

# ---------------------------------------------------------------------
# LVGL countdown page — pitimer display.py layout at 1280x720:
#   header top-centre (top margin = height/36 = 20), countdown centre
#   (raised by height/24 = 30 to make room for the pace line, but only
#   while the pace line is shown), pace line under the timer
#   (height/2 + timer_height/2 - height/15 = -48), game name
#   bottom-centre, date/time in the bottom corners (yellow), status line
#   centre (errors / waiting for clock). All labels start empty; the
#   1 Hz tick below fills them.
# ---------------------------------------------------------------------
lvgl:
  displays:
    - hdmi
  bg_color: 0x000000
  scrollbar_mode: "OFF"
  widgets:
    - obj:
        id: tp_smpte_t0
        align: TOP_LEFT

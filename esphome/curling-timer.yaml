        recolor: true
        text: ""
    - label:
        id: lbl_pace
        align: CENTER
        y: 0
        text_font: font_pace
        long_mode: CLIP
        recolor: true
        text: ""
    # ─── Progress Bar: black frame, white track, weighted colored bands ───
    # Screen is 1280x720. Progress bar fits width minus 20px padding each side = 1240px.
    # Height: 95px. Border radius: 1.5rem = 24px (rounded, clipped).
    # Outer frame: 8px BLACK border, WHITE track. Segment dividers: 4px BLACK.
    # Pill is centered: outer x=20..1260, inner x=28..1252 (1224px usable).
    # Fixed geometry inside the 1224px inner track: bands at x=0/282/564/846,
    # widths 282/282/282/378, with 4px dividers at 278/560/842. The skip
    # multiplier changes fill rate, not these slot widths.
    # Static YAML colors bypass render.cpp's hex6(), which swaps R/B for every
    # engine-supplied text color before LVGL draws it. Pre-swap here so the
    # HDMI bands land on the same RGB values as the WebUI CSS palette.
    # Container (white track + black frame + rounded/clipped corners)
    - obj:
        id: prog_pill
        align: BOTTOM_MID
        y: -79
        width: 1240
        height: 95
        bg_color: 0xFFFFFF
        bg_opa: cover
        border_width: 8
        border_color: 0x000000
        pad_all: 0
        radius: 24
        clip_corner: true
        hidden: true
    # Bottom Layer: 4 weighted colored bands (Lead, Second, Vice, Skip)
    # These are declared as top-level widgets but reparented into prog_pill at
    # runtime so LVGL's clip_corner trims them to the rounded frame. Bands have
    # NO radius (straight edges); their widths grow with progress and the white
    # pill shows through the remainder.
    - obj:
        id: prog_band0
        align: BOTTOM_LEFT
        x: 28
        y: -70
        width: 282
        height: 95
        bg_color: 0x4535DC  # Lead - #DC3545, pre-swapped for hex6() parity
        border_width: 0
        radius: 0
        hidden: true
    - obj:
        id: prog_band1
        align: BOTTOM_LEFT
        x: 310
        y: -70
        width: 282
        height: 95
        bg_color: 0x07C1FF  # Second - #FFC107, pre-swapped for hex6() parity
        border_width: 0
        radius: 0
        hidden: true
    - obj:
        id: prog_band2
        align: BOTTOM_LEFT
        x: 592
        y: -70
        width: 282
        height: 95
        bg_color: 0xF0CA0D  # Vice - #0DCAF0, pre-swapped for hex6() parity
        border_width: 0
        radius: 0
        hidden: true
    - obj:
        id: prog_band3
        align: BOTTOM_LEFT
        x: 874
        y: -70
        width: 378
        height: 95
        bg_color: 0x548719  # Skip - #198754, pre-swapped for hex6() parity
        border_width: 0
        radius: 0
        hidden: true
    # Band dividers: 4px BLACK right edges (border-r-4), straight, no radius
    - obj:
        id: prog_div0
        align: BOTTOM_LEFT
        x: 306
        y: -70
        width: 4
        height: 95
        bg_color: 0x000000
        border_width: 0
        radius: 0
        hidden: true
    - obj:
        id: prog_div1
        align: BOTTOM_LEFT
        x: 588
        y: -70
        width: 4
        height: 95
        bg_color: 0x000000
        border_width: 0
        radius: 0
        hidden: true
    - obj:
        id: prog_div2
        align: BOTTOM_LEFT
        x: 870
        y: -70
        width: 4
        height: 95
        bg_color: 0x000000
        border_width: 0
        radius: 0
        hidden: true
    # No inverse white mask: the pill's white track is visible through the
    # unwritten remainder of each band, so there is no square playhead edge.
    # Top Layer: 8px BLACK frame, drawn last over the clipped children so the
    # rounded outer edge stays crisp.
    - obj:
        id: prog_border
        align: BOTTOM_MID
        y: -79
        width: 1240
        height: 95
        bg_opa: 0
        border_width: 8
        border_color: 0x000000
        radius: 24
        hidden: true
    - label:
        id: lbl_status
        align: CENTER
        y: 0
        text_font: font_header
        long_mode: CLIP
        recolor: true
        text: ""
    - label:
        id: lbl_game
        align: BOTTOM_MID
        y: -4
        text_font: font_footer
        recolor: true
        text: ""
    - label:
        id: lbl_date
        align: BOTTOM_LEFT
        x: 10
        y: -4
        text_font: font_footer
        recolor: true
        text: ""
    - label:
        id: lbl_time
        align: BOTTOM_RIGHT
        x: -10
        y: -14
        text_font: font_footer
        recolor: true
        text: ""

# Non-blocking relay pulse used by the bell tick below (engine runs in
# the same 1 Hz display interval; scripts keep the delay off that path).
script:
  - id: pulse_relay_bell
    parameters:
      pulse_ms: int
    then:
      - switch.turn_on: relay_bell_ring
      - delay: !lambda "return pulse_ms;"
      - switch.turn_off: relay_bell_ring
  - id: pulse_relay_aux
    parameters:
      pulse_ms: int
    then:
      - switch.turn_on: relay_aux
      - delay: !lambda "return pulse_ms;"
      - switch.turn_off: relay_aux

# ---------------------------------------------------------------------
# 1 Hz display tick — refresh the snapshot, then push recoloured text
# into every label (empty string hides the label). Also runs the bell
# check (pitimer buzz_if_due) after the labels.
# ---------------------------------------------------------------------
interval:
  - interval: 1s
    then:
      - lambda: |-
          auto *eng = id(engine);
          if (eng == nullptr || !eng->ready())
            return;
          ::esphome::curling_engine::DisplaySnapshot snap;
          eng->display_snapshot(&snap);
          id(g_snap) = snap;
          id(pregame_blink_on) = !id(pregame_blink_on);
      - lambda: |-
          auto &s = id(g_snap);
          if (!s.valid) return;
          std::string hex = s.background_color;
          if (hex.empty()) hex = "black";
          if (hex == "black") hex = "#000000";
          else if (hex == "white") hex = "#FFFFFF";
          else if (hex == "red") hex = "#FF0000";
          else if (hex == "green") hex = "#00FF00";
          else if (hex == "blue") hex = "#0000FF";
          if (hex.size() == 7 && hex[0] == '#') {
            uint32_t c = std::stoul(hex.substr(1), nullptr, 16);
            lv_color_t color = lv_color_hex(c);
            lv_obj_set_style_bg_color(lv_screen_active(), color, 0);
            lv_obj_set_style_bg_opa(lv_screen_active(), LV_OPA_COVER, 0);
          }
      - lvgl.label.update:
          id: lbl_header
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            return ::esphome::curling_engine::recolor(s.header_color, s.header_text);
      - lvgl.label.update:
          id: lbl_cnt4
          align: CENTER
          y: !lambda |-
            // pitimer raises the timer by height/24 only while the pace line
            // is shown; otherwise it sits dead centre.
            // Moved up 45px (was 25, now +10 more, now +10 again).
            return id(g_snap).show_pace ? -75 : -45;
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_countdown || s.seconds_until_buzzer >= 3600)
              return std::string();
            std::string text = ::esphome::curling_engine::recolor(s.countdown_color, s.countdown);
            // Wig wag: during pregame with blink enabled, alternate the colon
            // between raised (U+02F8) and regular (:) each second so it appears
            // to move vertically. Do NOT blank the entire countdown.
            if (s.is_pregame && s.pregame_blink && !id(pregame_blink_on)) {
              // Replace raised colon (UTF-8 0xCB 0xB8) with regular colon
              for (size_t i = 0; i + 1 < text.size(); ++i) {
                if (static_cast<unsigned char>(text[i]) == 0xCB &&
                    static_cast<unsigned char>(text[i+1]) == 0xB8) {
                  text[i] = ':';
                  text.erase(i+1, 1);
                }
              }
            }
            return text;
      - lvgl.label.update:
          id: lbl_cnt5
          align: CENTER
          y: !lambda |-
            // Moved up 45px (was 25, now +10 more, now +10 again).
            return id(g_snap).show_pace ? -75 : -45;
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_countdown || s.seconds_until_buzzer < 3600)
              return std::string();
            std::string text = ::esphome::curling_engine::recolor(s.countdown_color, s.countdown);
            if (s.is_pregame && s.pregame_blink && !id(pregame_blink_on)) {
              for (size_t i = 0; i + 1 < text.size(); ++i) {
                if (static_cast<unsigned char>(text[i]) == 0xCB &&
                    static_cast<unsigned char>(text[i+1]) == 0xB8) {
                  text[i] = ':';
                  text.erase(i+1, 1);
                }
              }
            }
            return text;
      - lvgl.label.update:
          id: lbl_pace
          align: CENTER
          y: !lambda |-
            // pitimer: the pace line sits just below the timer, overlapping
            // its bottom padding. The timer's box height (LVGL line height)
            // gives the glyph height the digits occupy, so the line follows
            // whichever timer font is in use.
            // Moved up 25px + 15px + 10px = 50px total (was 40, now -10) + timer height offset.
            auto &s = id(g_snap);
            const bool five = s.show_countdown && s.seconds_until_buzzer >= 3600;
            lv_obj_t *timer = five ? id(lbl_cnt5) : id(lbl_cnt4);
            if (timer == nullptr) return -20;
            return -20 + (int) (0.3225f * lv_obj_get_height(timer));
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_pace)
              return std::string();
            return ::esphome::curling_engine::recolor(s.pace_color, s.pace_text);
      - lambda: |-
          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
          #if LVGL_VERSION_MAJOR > 9 || (LVGL_VERSION_MAJOR == 9 && LVGL_VERSION_MINOR >= 6)
            lv_obj_set_hidden(obj, hidden);
          #else
            if (hidden)
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_remove_flag(obj, LV_OBJ_FLAG_HIDDEN);
          #endif
          };
          auto &s = id(g_snap);
          bool show = (id(engine)->get_display_test_mode() == "normal") &&
                      s.show_progress && s.progress_end_count > 0 && s.progress_game_duration > 0;
          // Show/hide the frame, track and colored bands.
          lv_obj_t *bands[4] = {id(prog_band0), id(prog_band1), id(prog_band2), id(prog_band3)};
          lv_obj_t *divs[3] = {id(prog_div0), id(prog_div1), id(prog_div2)};
          // Parent the bands and dividers to the pill once. The pill's
          // clip_corner style then trims their square corners to the rounded
          // frame, matching the reference's overflow-clip. Coordinates below
          // are relative to the pill's content area (inside its 8px border).
          static bool progress_parented = false;
          if (!progress_parented && id(prog_pill) != nullptr) {
            const int band_x[4] = {0, 282, 564, 846};
            const int div_x[3] = {278, 560, 842};
            for (int i = 0; i < 4; i++) {
              if (bands[i] == nullptr) continue;
              lv_obj_set_parent(bands[i], id(prog_pill));
              lv_obj_set_pos(bands[i], band_x[i], 0);
              lv_obj_set_height(bands[i], 79);
            }
            for (int i = 0; i < 3; i++) {
              if (divs[i] == nullptr) continue;
              lv_obj_set_parent(divs[i], id(prog_pill));
              lv_obj_set_pos(divs[i], div_x[i], 0);
              lv_obj_set_height(divs[i], 79);
            }
            progress_parented = true;
          }
          for (int i = 0; i < 4; i++) {
            if (bands[i] != nullptr) {
              if (show) set_hidden(bands[i], false);
              else set_hidden(bands[i], true);
            }
          }
          if (id(prog_border) != nullptr) {
            if (show) set_hidden(id(prog_border), false);
            else set_hidden(id(prog_border), true);
          }
          if (id(prog_pill) != nullptr) {
            if (show) set_hidden(id(prog_pill), false);
            else set_hidden(id(prog_pill), true);
          }
          // Widths of the four allotted band slots (weights 1,1,1,1.4).
          const int full_w[4] = {282, 282, 282, 378};
          if (!show) {
            for (int i = 0; i < 3; i++)
              if (divs[i] != nullptr) set_hidden(divs[i], true);
            return;
          }
          int since = s.progress_seconds_since_start;
          int dur = s.progress_game_duration;
          int ends = s.progress_end_count;
          float skip_mult = s.progress_skip_multiplier;
          if (skip_mult <= 0) skip_mult = 1.4f;
          if (dur <= 0 || ends <= 0) {
            for (int i = 0; i < 4; i++)
              if (bands[i] != nullptr) lv_obj_set_width(bands[i], full_w[i]);
            for (int i = 0; i < 3; i++)
              if (divs[i] != nullptr) set_hidden(divs[i], false);
            return;
          }
          if (since < 0) since = 0;
          if (since > dur) since = dur;
          int end_dur = dur / ends;
          if (end_dur <= 0) end_dur = 1;
          int in_end = since % end_dur;
          // Progress through the current end resets at every end boundary;
          // the engine still sounds the buzzer at the end of each end.
          float progress = (float)in_end * skip_mult / (float)end_dur;
          if (progress < 0) progress = 0;
          if (progress > 1) progress = 1;
          // Map progress onto weights [1, 1, 1, skip_mult]. Each band grows
          // from its fixed left edge; the white track shows the remainder.
          const float weights[4] = {1.0f, 1.0f, 1.0f, skip_mult};
          const float total = 3.0f + skip_mult;
          // progress is 0..1 across the whole bar; scale it to the weight sum
          // so all four bands can fill by the end of an end.
          const float scaled = progress * total;
          float before = 0.0f;
          for (int i = 0; i < 4; i++) {
            float frac = (scaled - before) / weights[i];
            if (frac < 0) frac = 0;
            if (frac > 1) frac = 1;
            before += weights[i];
            if (bands[i] != nullptr)
              lv_obj_set_width(bands[i], (int) (frac * full_w[i] + 0.5f));
            // A divider is the 4px black right edge of a completed band.
            if (i < 3 && divs[i] != nullptr) {
              if (scaled >= before)
                set_hidden(divs[i], false);
              else
                set_hidden(divs[i], true);
            }
          }
      - lvgl.label.update:
          id: lbl_status
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_status)
              return std::string();
            return ::esphome::curling_engine::recolor(s.status_color, s.status_text);
      - lvgl.label.update:
          id: lbl_game
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_game_name)
              return std::string();
            return ::esphome::curling_engine::recolor(
                s.footer_color, s.game_name);
      - lvgl.label.update:
          id: lbl_date
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_date_time)
              return std::string();
            return ::esphome::curling_engine::recolor(
                s.footer_color, s.date_text);
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_date_time)
              return std::string();
            return ::esphome::curling_engine::recolor(
                s.footer_color, s.time_text);

  - interval: 5s
    then:
      - lvgl.widget.update:
          id:
            - tp_smpte_t0
            - tp_smpte_t1
            - tp_smpte_t2
            - tp_smpte_t3
            - tp_smpte_t4
            - tp_smpte_t5
            - tp_smpte_t6
            - tp_smpte_b0
            - tp_smpte_b1
            - tp_smpte_b2
            - tp_smpte_b3
            - tp_smpte_b4
            - tp_smpte_b5
            - tp_smpte_b6
            - tp_smpte_res
          hidden: !lambda |-
            return !(id(engine)->get_display_test_mode() == "smpte" || id(engine)->get_display_test_mode() == "colorbars");
      - lvgl.widget.update:
          id:
            - tp_pluge_field
            - tp_pluge_0
            - tp_pluge_1
            - tp_pluge_2
            - tp_pluge_3
            - tp_pluge_4
            - tp_pluge_5
            - tp_pluge_6
            - tp_pluge_7
          hidden: !lambda |-
            return !(id(engine)->get_display_test_mode() == "pluge");
      - lvgl.widget.update:
          id:
            - tp_geom_border
            - tp_geom_v0
            - tp_geom_v1
            - tp_geom_v2
            - tp_geom_v3
            - tp_geom_v4
            - tp_geom_v5
            - tp_geom_v6
            - tp_geom_v7
            - tp_geom_h0
            - tp_geom_h1
            - tp_geom_h2
            - tp_geom_h3
            - tp_geom_h4
            - tp_geom_h5
            - tp_geom_cv
            - tp_geom_ch
          hidden: !lambda |-
            return !(id(engine)->get_display_test_mode() == "geometry");

  - interval: 100ms
    then:
      # Bell: engine bell_tick — for the live game, pulse the configured
      # relays at game start, at the countdown warning, and at the buzzer
      # time (settings file, web editor "Bell / buzzer" config). RELAY1 ->
      # relay 1, RELAY2 -> relay 2; RELAY3/4 have no hardware.
      - lambda: |-
          auto *eng = id(engine);
          if (eng == nullptr)
            return;
          ::esphome::curling_engine::BellRing ring;
          if (!eng->bell_tick(&ring))
            return;
          if (ring.mask & ::esphome::curling_engine::BELL_RELAY_1)
            id(pulse_relay_bell).execute(static_cast<int>(ring.duration_ms_1 ? ring.duration_ms_1 : ring.duration_ms));
          if (ring.mask & ::esphome::curling_engine::BELL_RELAY_2)
            id(pulse_relay_aux).execute(static_cast<int>(ring.duration_ms_2 ? ring.duration_ms_2 : ring.duration_ms));

  - interval: 5s
    then:
      - lambda: |-
          id(ethernet_up).publish_state(ethernet::global_eth_component->is_connected());

# ===========================================  ==========================
# ESP32 Curling  T imer
# M5Stack Unit PoE-P4 (U213) + Add-On  D isplay Out LT8912B HDMI (U221)
# + M5Stac k U nit 2Relay (HY2.0-4P, GPIO control) + ESP 32-C 6 (SuperMini)
#   SDIO co-processor for  Wi-F i 6
#
# Port of the rpi-buzzer / piti mer fi rmware (v2.4.4) to ESPHome.
#
# Sche dule en gine + web editor + LT8912B HDMI disp lay + LV GL countdown
# UI are enabled below  (externa l_components).
#
# THIS IS THE PA STE-READY  VARIANT (git source) for the Home  Assistant
 # ESPHome Device Builder add-on.  Repo/CI buil ds use curling-timer.yaml.
# == ============= =============================== ============== =========

substitutions:
   # IANA timezon e, e.g. "America/New_York" � � see docs/BUILD .md
  timezone: "America/To ronto"

esphome:
  name: curling-timer
   friendly_name: Cu rling Timer
  name_add_ma c_suffix: false

 esp32:
  variant: esp32p 4
  # First bench b oot showed "Chip Revisio n: 103" (v1.3) on the  U213 —
  # pre-rev3  silicon; required so  the build targets rev< 3.0
  engineering_samp le: true
  cpu_frequ ency: 360MHz
  flash_si ze: 16MB
  framewor k:
    type: esp-idf
     # The settings st ore keeps timestamped back ups in a "backups"  folder and
    # lists th em for the web ed itor. ESP-IDF's VFS only pro vides opendir/
     # readdir/mkdir when this  is on (otherwi se newlib's always-fail stubs  are
    # lin ked and every save fails with " cannot create  backup directory").
    #
     # Long file  names: ESPHome's generated sdkco nfig leaves  FATFS with
    # LFN_NONE, so on ly 8.3 nam es can be created and
    # "pitim er_settin gs.yml" fails with FR_INVALID_NAME.  LFN_HEAP  enables
    # them (the LFN buffer  is ~300  bytes per open file).
    sdkconfig_ option s:
      CONFIG_VFS_SUPPORT_DIR: y
       C ONFIG_FATFS_LFN_HEAP: y
      CONFIG_ES P_TA SK_WDT_TIMEOUT_S: "300"
      # Persist  cra sh diagnostics to flash for post-mortem an al ysis.
      CONFIG_ESP_COREDUMP_ENABLE_TO_ F LASH: y
      CONFIG_ESP_COREDUMP_DATA_FORM  AT_ELF: y
      CONFIG_ESP_COREDUMP_CHECKSUM  _CRC32: y
    advanced:
      execute_from _ psram: false

psram:
  # ESP32-P4 only s up ports hex mode in ESPHome (2026.9.1)
  sp eed : 200MHz

safe_mode:
  disabled: true 

l ogger:
  # USB Serial/JTAG on the U213  USB-C  port is the bench console.
  hardware _uart:  USB_SERIAL_JTAG
  level: VERBOSE
   task_lo g_buffer_size: 8192

select:
  - p latform:  logger
    name: "Log Level"
     id: log_l evel_select


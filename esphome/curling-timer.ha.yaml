#   (height/2 + timer_height/2 - height/15 = -48), game name
#   bottom-centre, date/time in the bottom corners (yellow), status line
#   centre (errors / waiting for clock). All labels start empty; the
#   1 Hz tick below fills them.
# ---------------------------------------------------------------------
lvgl:

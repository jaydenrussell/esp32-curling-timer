# =========================================== ==========================
# ESP32 Curling T imer
# M5Stack Unit PoE-P4 (U213) + Add-On D isplay Out LT8912B HDMI (U221)
# + M5Stack U nit 2Relay (HY2.0-4P, GPIO control) + ESP32-C 6 (SuperMini)
#   SDIO co-processor for Wi-F i 6
#
# Port of the rpi-buzzer / pitimer fi rmware (v2.4.4) to ESPHome.
#
# Schedule en gine + web editor + LT8912B HDMI display + LV GL countdown
# UI are enabled below (externa l_components).
#
# THIS IS THE PASTE-READY  VARIANT (git source) for the Home Assistant
 # ESPHome Device Builder add-on. Repo/CI buil ds use curling-timer.yaml.
# =============== ============================================= =========

substitutions:
  # IANA timezon e, e.g. "America/New_York" — see docs/BUILD .md
  timezone: "America/Toronto"

esphome :
  name: curling-timer
  friendly_name: Cu rling Timer
  name_add_mac_suffix: false

 esp32:
  variant: esp32p4
  # First bench b oot showed "Chip Revision: 103" (v1.3) on the  U213 —
  # pre-rev3 silicon; required so  the build targets rev<3.0
  engineering_samp le: true
  cpu_frequency: 360MHz
  flash_si ze: 16MB
  framework:
    type: esp-idf
     # The settings store keeps timestamped back ups in a "backups" folder and
    # lists th em for the web editor. ESP-IDF's VFS only pro vides opendir/
    # readdir/mkdir when this  is on (otherwise newlib's always-fail stubs  are
    # linked and every save fails with " cannot create backup directory").
    #
     # Long file names: ESPHome's generated sdkco nfig leaves FATFS with
    # LFN_NONE, so on ly 8.3 names can be created and
    # "pitim er_settings.yml" fails with FR_INVALID_NAME.  LFN_HEAP enables
    # them (the LFN buffer  is ~300 bytes per open file).
    sdkconfig_ options:
      CONFIG_VFS_SUPPORT_DIR: y
       CONFIG_FATFS_LFN_HEAP: y
      CONFIG_ES P_TASK_WDT_TIMEOUT_S: "300"
      # Persist  crash diagnostics to flash for post-mortem an alysis.
      CONFIG_ESP_COREDUMP_ENABLE_TO_ FLASH: y
      CONFIG_ESP_COREDUMP_DATA_FORM AT_ELF: y
      CONFIG_ESP_COREDUMP_CHECKSUM _CRC32: y
    advanced:
      execute_from_ psram: false

psram:
  # ESP32-P4 only sup ports hex mode in ESPHome (2026.9.1)
  speed : 200MHz

safe_mode:
  disabled: true

l ogger:
  # USB Serial/JTAG on the U213 USB-C  port is the bench console.
  hardware_uart:  USB_SERIAL_JTAG
  level: VERBOSE
  task_lo g_buffer_size: 8192

select:
  - platform:  logger
    name: "Log Level"
    id: log_l evel_select

json:

# ------------------- --------------------------------------------- -----
# Networking: PoE Ethernet is the defa ult and only requirement.
# Wi-Fi (via the C 6 SDIO co-processor) is an OPTIONAL add-on pa ckage —
# add it only when the SuperMini C 6 is wired and flashed:
#
# packages:
#    wifi_addon: !include wifi-c6-failover.yaml
#  -------------------------------------------- -------------------------
network:

ethern et:
  # M5Stack Unit PoE-P4: PHY IP101GRI @  address 1 (per M5Stack U213 pin map)
  # RXD V=G28 RXD0=G29 RXD1=G30 TXD0=G34 TXD1=G35 TXE N=G49 RMII_CLK=G50
  type: IP101
  phy_addr : 1
  mdc_pin: GPIO31
  mdio_pin: GPIO52
   power_pin: GPIO51
  clk:
    pin: GPIO50
     mode: CLK_EXT_IN


# ----------------- --------------------------------------------- -------
# mDNS - advertises the device as cu rling-timer.local on the local
# network, so  Home Assistant can discover it and the devic e can be
# reached by name (http://curling-t imer.local:8080 for the web editor).
# The h ostname follows the device name above.
# --- --------------------------------------------- ---------------------
mdns:
  id: mdns_adve rtiser

# --------------------------------- ------------------------------------
# Link  diagnostics — which network path is actuall y up.
# Ethernet is primary whenever its lin k is connected; Wi-Fi (C6) is
# failover; th e AP hotspot is last-resort.
# ------------- --------------------------------------------- -----------
binary_sensor:
  - platform: te mplate
    name: "Ethernet Connected"
    i d: ethernet_up
    device_class: connectivit y
    entity_category: diagnostic
    lambd a: |-
      return ethernet::global_eth_comp onent->is_connected();

# ----------------- --------------------------------------------- -------
# Services
# ---------------------- --------------------------------------------- --
# Native API - encrypted. The key is a 32 -byte base64 secret; without
# it the API sp eaks plaintext and anyone on the network can  drive the
# device. Generate with: openssl r and -base64 32
api:
  encryption:
    key:  !secret curling_timer__encryption_key

# #  Over-the-air updates - encrypted, so a firmw are image cannot be pushed
# # or installed  by anyone who only has network access. The ke y also
# # authenticates the uploader, so no  separate password is used (ESPHome
# # refu ses password + encryption together). ESPHome  requires the OTA key
# # to be the API key,  so both use the same secret.
ota:
  - platf orm: esphome

web_server:
  port: 80
  lo g: true
  auth:
    # digest avoids sending  the password in a reversible form
    # (ES PHome deprecates basic auth in 2027.1)
    t ype: digest
    username: admin
    passwor d: !secret web_password

time:
  - platfor m: sntp
    id: sntp_time
    timezone: ${t imezone}
    servers:
      - time.cloudfla re.com
      - pool.ntp.org
    on_time_syn c:
      then:
        - logger.log: "Time  synchronized"

# -------------------------- -------------------------------------------
 # M5Stack Unit 2Relay — wired to Grove Port  B (HY2.0-4P: G53, G54, 5V, GND)
# Manual LE D-on = relay closed. Drives the 24VAC bell ci rcuit.
# Both channels are manual HA toggles ; the schedule engine drives them
# from the  settings file (web editor Config tab, "Bell  / buzzer"):
#   buzzer.relays            - r elays that ring at the buzzer time
#   buzze r.ring_at_start     - relays that ring when a  game starts
#   buzzer.countdown         -  {minutes_before: N, relays: [...]} warning
#    buzzer.duration          - ring length in  seconds (all events)
# Each event rings once  per game; empty relay lists turn an event of f.
# restore_mode ALWAYS_OFF matches pitimer 's reset_buzzer(): never leave
# a relay ene rgised across reboot.
# -------------------- --------------------------------------------- ----
switch:
  - platform: gpio
    name:  "Relay 1 (Bell)"
    id: relay_bell_ring
     pin: GPIO53
    restore_mode: ALWAYS_OFF
 
  - platform: gpio
    name: "Relay 2 (Aux )"
    id: relay_aux
    pin: GPIO54
    r estore_mode: ALWAYS_OFF

# ---------------- --------------------------------------------- --------
# Diagnostics
# ------------------ --------------------------------------------- ------
text_sensor:
  - platform: version
     name: "Firmware Version"

sensor:
  -  platform: uptime
    name: "Uptime"

# --- --------------------------------------------- ---------------------
# Schedule engine + we b editor (external_components).
# PASTE-READ Y for Home Assistant "ESPHome Device Builder" : the source
# is fetched from GitHub (anony mous, repo is public) — no repo checkout
#  or path mapping needed. Copy this entire fil e into
# /config/esphome/curling-timer.yaml  and click Install.
# (Repo/CI builds use cur ling-timer.yaml with the relative source.)
#  -------------------------------------------- -------------------------
external_component s:
  - source:
      type: git
      url:  https://github.com/jaydenrussell/esp32-curlin g-timer
      ref: v2026.10.209
      path:  external_components   # required: ESPHome on ly auto-scans
                                   # components/ and esphome/components/
     components: [curling_engine, web_editor, lt 8912b]
    # The ref is a release tag, so th e components always match this
    # file: a  cached checkout of an older "main" can never  mismatch the
    # YAML (which is what brok e the add-on builds).
    refresh: 0s

cur ling_engine:
  id: engine
  store_path: /fl ash

web_editor:
  # The "Web Editor" diag nostic entity (listening on port 8080 / the
   # reason it is not) is created by the compo nent itself, so this file
  # never calls co mponent APIs - a cached (older) clone of the  external
  # component can then never break  the build.
  id: web_editor_comp
  password : !secret web_password
  port: 8080

# --- --------------------------------------------- ---------------------
# HDMI display: M5Stac k Add-On Display Out LT8912B (U221), 1280x720 @60.
# esp_ldo powers the MIPI-DSI PHY (chan nel 3 @ 2.5V per M5GFX U221) —
# lt8912b d epends on it. The LVGL page below drives the  pixels; without
# an lvgl: block this compon ent would show the ESPHome test card instead. 
# ----------------------------------------- ----------------------------
esp_ldo:
  - c hannel: 3
    voltage: 2.5V

lt8912b:
  i d: hdmi
  reset_pin: GPIO4
  enable_pin: GP IO33
  sda_pin: GPIO0
  scl_pin: GPIO1

#  -------------------------------------------- -------------------------
# Fonts - Lato Bol d (static TTF from google/fonts, fetched once  per
# build and cached). Lato ships U+02F8,  the modifier letter raised
# colon pitimer  uses instead of ':'.
#
# Sizes are measured  off the pitimer reference screen (1280x720):  the
# header text spans ~95% of the width,  the 5-digit timer ~93%, the
# pace line ~80%  and the footer date ~22%.
#   header 96   t imer 5 digits 370   timer 4 digits 450
#   p ace 85     footer 52
# The 4-digit timer is  larger than the 5-digit one (as in pitimer:
 # 992 vs 816) because it has fewer glyphs to  fit across the width.
# -------------------- --------------------------------------------- ----
font:
  - file: "https://raw.githubuse rcontent.com/google/fonts/main/ofl/lato/Lato- Bold.ttf"
    id: font_timer_4
    size: 45 0
    glyphs: ["0123456789", "\u02F8"]
  -  file: "https://raw.githubusercontent.com/goog le/fonts/main/ofl/lato/Lato-Bold.ttf"
    id : font_timer_5
    size: 370
    glyphs: [" 0123456789", "\u02F8"]
  - file: "https://ra w.githubusercontent.com/google/fonts/main/ofl /lato/Lato-Bold.ttf"
    id: font_header
     size: 96
    glyphsets: [GF_Latin_Kernel] 
  - file: "https://raw.githubusercontent.com /google/fonts/main/ofl/lato/Lato-Bold.ttf"
     id: font_pace
    size: 85
    glyphsets : [GF_Latin_Kernel]
  - file: "https://raw.g ithubusercontent.com/google/fonts/main/ofl/la to/Lato-Bold.ttf"
    id: font_footer
    s ize: 52
    glyphsets: [GF_Latin_Kernel]
     glyphs: ["\u02F8"]

# Latest display snap shot from CurlingEngineComponent::display_sna pshot()
# (the pitimer draw_screen data prep ), written once per second below.
globals:
   - id: g_snap
    type: esphome::curling_en gine::DisplaySnapshot
    restore_value: no 


# Non-blocking relay pulse used by the bell tick below (engine runs in
# the same 1 Hz display interval; scripts keep the delay off that path).
script:
  - id: pulse_relay_bell
    parameters:
      pulse_ms: int
    then:
      - switch.turn_on: relay_bell_ring
      - delay: !lambda "return pulse_ms;"
      - switch.turn_off: relay_bell_ring
  - id: pulse_relay_aux
    parameters:
      pulse_ms: int
    then:
      - switch.turn_on: relay_aux
      - delay: !lambda "return pulse_ms;"
      - switch.turn_off: relay_aux

# ---------------------------------------------------------------------
# 1 Hz display tick — refresh the snapshot, then push recoloured text
# into every label (empty string hides the label). Also runs the bell
# check (pitimer buzz_if_due) after the labels.
# ---------------------------------------------------------------------
interval:
  - interval: 1s
    then:
      - lambda: |-
          auto *eng = id(engine);
          if (eng == nullptr || !eng->ready())
            return;
          ::esphome::curling_engine::DisplaySnapshot snap;
          eng->display_snapshot(&snap);
          id(g_snap) = snap;
      - lvgl.label.update:
          id: lbl_header
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            return ::esphome::curling_engine::recolor(s.header_color, s.header_text);
      - lvgl.label.update:
          id: lbl_cnt4
          align: CENTER
          y: !lambda |-
            // pitimer raises the timer by height/24 only while the pace line
            // is shown; otherwise it sits dead centre.
            return id(g_snap).show_pace ? -30 : 0;
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_countdown || s.seconds_until_buzzer >= 3600)
              return std::string();
            return ::esphome::curling_engine::recolor(s.countdown_color, s.countdown);
      - lvgl.label.update:
          id: lbl_cnt5
          align: CENTER
          y: !lambda |-
            return id(g_snap).show_pace ? -30 : 0;
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_countdown || s.seconds_until_buzzer < 3600)
              return std::string();
            return ::esphome::curling_engine::recolor(s.countdown_color, s.countdown);
      - lvgl.label.update:
          id: lbl_pace
          align: CENTER
          y: !lambda |-
            // pitimer: the pace line sits just below the timer, overlapping
            // its bottom padding. The timer's box height (LVGL line height)
            // gives the glyph height the digits occupy, so the line follows
            // whichever timer font is in use.
            auto &s = id(g_snap);
            const bool five = s.show_countdown && s.seconds_until_buzzer >= 3600;
            lv_obj_t *timer = five ? id(lbl_cnt5) : id(lbl_cnt4);
            return 50 + (int) (0.3225f * lv_obj_get_height(timer));
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_pace)
              return std::string();
            return ::esphome::curling_engine::recolor(s.pace_color, s.pace_text);
      - lvgl.label.update:
          id: lbl_status
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_status)
              return std::string();
            return ::esphome::curling_engine::recolor(s.status_color, s.status_text);
      - lvgl.label.update:
          id: lbl_game
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_game_name)
              return std::string();
            return ::esphome::curling_engine::recolor(
                s.footer_color, s.game_name);
      - lvgl.label.update:
          id: lbl_date
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_date_time)
              return std::string();
            return ::esphome::curling_engine::recolor(
                s.footer_color, s.date_text);
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            std::string mode = id(engine)->get_display_test_mode();
            if (mode != "normal") return std::string();
            auto &s = id(g_snap);
            if (!s.show_date_time)
              return std::string();
            return ::esphome::curling_engine::recolor(
                s.footer_color, s.time_text);
      - lvgl.widget.update:
          id: test_bar_white
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "smpte" && id(engine)->get_display_test_mode() != "colorbars";
      - lvgl.widget.update:
          id: test_bar_yellow
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "smpte" && id(engine)->get_display_test_mode() != "colorbars";
      - lvgl.widget.update:
          id: test_bar_cyan
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "smpte" && id(engine)->get_display_test_mode() != "colorbars";
      - lvgl.widget.update:
          id: test_bar_green
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "smpte" && id(engine)->get_display_test_mode() != "colorbars";
      - lvgl.widget.update:
          id: test_bar_magenta
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "smpte" && id(engine)->get_display_test_mode() != "colorbars";
      - lvgl.widget.update:
          id: test_bar_red
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "smpte" && id(engine)->get_display_test_mode() != "colorbars";
      - lvgl.widget.update:
          id: test_bar_blue
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "smpte" && id(engine)->get_display_test_mode() != "colorbars";
      - lvgl.widget.update:
          id: test_overscan
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "smpte" && id(engine)->get_display_test_mode() != "colorbars";
      - lvgl.widget.update:
          id: test_res_label
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "smpte" && id(engine)->get_display_test_mode() != "colorbars";
      - lvgl.widget.update:
          id: test_pluge_black
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "pluge";
      - lvgl.widget.update:
          id: test_pluge_dark
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "pluge";
      - lvgl.widget.update:
          id: test_pluge_darker
          hidden: !lambda |-
            return id(engine)->get_display_test_mode() != "pluge";

      # Bell: engine bell_tick — for the live game, pulse the configured
      # relays at game start, at the countdown warning, and at the buzzer
      # time (settings file, web editor "Bell / buzzer" config). RELAY1 ->
      # relay 1, RELAY2 -> relay 2; RELAY3/4 have no hardware.
      - lambda: |-
          auto *eng = id(engine);
          if (eng == nullptr)
            return;
          ::esphome::curling_engine::BellRing ring;
          if (!eng->bell_tick(&ring))
            return;
          const int pulse_ms = static_cast<int>(ring.duration_ms);
          if (ring.mask & ::esphome::curling_engine::BELL_RELAY_1)
            id(pulse_relay_bell).execute(pulse_ms);
          if (ring.mask & ::esphome::curling_engine::BELL_RELAY_2)
            id(pulse_relay_aux).execute(pulse_ms);



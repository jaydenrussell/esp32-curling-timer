# --------- ---------- ---------------------------------- ----------- -----
# Networking: PoE Ethernet  is the defa ult and only requirement.
# Wi- Fi (via the C 6 SDIO co-processor) is an OPTI ONAL add-on pa ckage —
# add it only when  the SuperMini C 6 is wired and flashed:
#
#  packages:
#    wifi_addon: !include wifi-c6 -failover.yaml
#  -------------------------- ------------------ ------------------------- 
network:

ethern et:
  # M5Stack Unit PoE -P4: PHY IP101GRI @  address 1 (per M5Stack U 213 pin map)
  # RXD V=G28 RXD0=G29 RXD1=G30  TXD0=G34 TXD1=G35 TXE N=G49 RMII_CLK=G50
   type: IP101
  phy_addr : 1
  mdc_pin: GPIO3 1
  mdio_pin: GPIO52
   power_pin: GPIO51
   clk:
    pin: GPIO50
     mode: CLK_EXT_I N


# ----------------- ------------------ --------------------------- -------
# mDNS -  advertises the device as cu rling-timer.loca l on the local
# network, so  Home Assistant  can discover it and the devic e can be
# re ached by name (http://curling-t imer.local:80 80 for the web editor).
# The h ostname foll ows the device name above.
# --- ----------- ---------------------------------- ---------- -----------
mdns:
  id: mdns_adve rtiser
 
# --------------------------------- -------- ----------------------------
# Link  diagnos tics — which network path is actuall y up. 
# Ethernet is primary whenever its lin k is  connected; Wi-Fi (C6) is
# failover; th e AP  hotspot is last-resort.
# ------------- --- ------------------------------------------ -- ---------
binary_sensor:
  - platform: te m plate
    name: "Ethernet Connected"
    i  d: ethernet_up
    device_class: connectivit  y
    entity_category: diagnostic
    lamb d a: |-
      return ethernet::global_eth_co mp onent->is_connected();

# -------------- --- ----------------------------------------- ---- -------
# Services
# ----------------- ----- --------------------------------------- ------ --
# Native API - encrypted. The key  is a 32 -byte base64 secret; without
# it th e API sp eaks plaintext and anyone on the net work can  drive the
# device. Generate with:  openssl r and -base64 32
api:
  encryption :
    key:  !secret curling_timer__encryptio n_key

# #  Over-the-air updates - encrypte d, so a firmw are image cannot be pushed
# #  or installed  by anyone who only has network  access. The ke y also
# # authenticates the  uploader, so no  separate password is used ( ESPHome
# # refu ses password + encryption t ogether). ESPHome  requires the OTA key
# #  to be the API key,  so both use the same secr et.
ota:
  - platf orm: esphome

web_serv er:
  port: 80
  lo g: true
  auth:
    #  digest avoids sending  the password in a rev ersible form
    # (ES PHome deprecates basi c auth in 2027.1)
    t ype: digest
    use rname: admin
    passwor d: !secret web_pass word

time:
  - platfor m: sntp
    id: s ntp_time
    timezone: ${t imezone}
    ser vers:
      - time.cloudfla re.com
      -  pool.ntp.org
    on_time_syn c:
      then: 
        - logger.log: "Time  synchronized" 

# -------------------------- ------------- ------------------------------
 # M5Stack Un it 2Relay — wired to Grove Port  B (HY2.0-4 P: G53, G54, 5V, GND)
# Manual LE D-on = rel ay closed. Drives the 24VAC bell ci rcuit.
#  Both channels are manual HA toggles ; the sc hedule engine drives them
# from the  settin gs file (web editor Config tab, "Bell  / buzz er"):
#   buzzer.relays            - r elays  that ring at the buzzer time
#   buzze r.ri ng_at_start     - relays that ring when a  ga me starts
#   buzzer.countdown         -  {m inutes_before: N, relays: [...]} warning
#     buzzer.duration          - ring length in   seconds (all events)
# Each event rings once   per game; empty relay lists turn an event o f f.
# restore_mode ALWAYS_OFF matches pitim er 's reset_buzzer(): never leave
# a relay  ene rgised across reboot.
# ---------------- ---- ---------------------------------------- ----- ----
switch:
  - platform: gpio
     name:  "Relay 1 (Bell)"
    id: relay_bell_r ing
     pin: GPIO53
    restore_mode: ALWA YS_OFF
 
  - platform: gpio
    name: "Rel ay 2 (Aux )"
    id: relay_aux
    pin: GPI O54
    r estore_mode: ALWAYS_OFF


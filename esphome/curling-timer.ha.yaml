# Non-blocking re lay pulse used by the bell tick below (engine  runs in
# the same 1 Hz display interval; s cripts keep the delay off that path).
script :
  - id: pulse_relay_bell
    parameters: 
      pulse_ms: int
    then:
      - swit ch.turn_on: relay_bell_ring
      - delay: ! lambda "return pulse_ms;"
      - switch.tur n_off: relay_bell_ring
  - id: pulse_relay_a ux
    parameters:
      pulse_ms: int
     then:
      - switch.turn_on: relay_aux
       - delay: !lambda "return pulse_ms;"
       - switch.turn_off: relay_aux

# --------- --------------------------------------------- ---------------
# 1 Hz display tick — refr esh the snapshot, then push recoloured text
 # into every label (empty string hides the la bel). Also runs the bell
# check (pitimer bu zz_if_due) after the labels.
# ------------- --------------------------------------------- -----------
interval:
  - interval: 1s
     then:
      - lambda: |-
          auto *e ng = id(engine);

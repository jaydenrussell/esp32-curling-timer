    name:  "Uptime"

# --- --------------------------- ------------------ ---------------------
# S chedule engine + we b editor (external_compon ents).
# PASTE-READ Y for Home Assistant "ES PHome Device Builder" : the source
# is fetc hed from GitHub (anony mous, repo is public)  — no repo checkout
#  or path mapping need ed. Copy this entire fil e into
# /config/es phome/curling-timer.yaml  and click Install. 
# (Repo/CI builds use cur ling-timer.yaml wi th the relative source.)
#  ---------------- ---------------------------- ---------------- ---------
external_component s:
  - source: 
      type: git
      url:  https://github .com/jaydenrussell/esp32-curlin g-timer
       ref: v2026.10.209
      path:  external_co mponents   # required: ESPHome on ly auto-sca ns
                                   # comp onents/ and esphome/components/
     compone nts: [curling_engine, web_editor, lt 8912b]
     # The ref is a release tag, so th e compo nents always match this
    # file: a  cache d checkout of an older "main" can never  mism atch the
    # YAML (which is what brok e th e add-on builds).
    refresh: 0s

cur lin g_engine:
  id: engine
  store_path: /fl as h

web_editor:
  # The "Web Editor" diag n ostic entity (listening on port 8080 / the
    # reason it is not) is created by the compo  nent itself, so this file
  # never calls c o mponent APIs - a cached (older) clone of th e  external
  # component can then never bre ak  the build.
  id: web_editor_comp
  pass word : !secret web_password
  port: 8080

 # --- --------------------------------------- ------ ---------------------
# HDMI display:  M5Stac k Add-On Display Out LT8912B (U221),  1280x720 @60.
# esp_ldo powers the MIPI-DSI  PHY (chan nel 3 @ 2.5V per M5GFX U221) —
#  lt8912b d epends on it. The LVGL page below  drives the  pixels; without
# an lvgl: block  this compon ent would show the ESPHome test  card instead. 
# --------------------------- -------------- ----------------------------
 esp_ldo:
  - c hannel: 3
    voltage: 2.5V 

lt8912b:
  i d: hdmi
  reset_pin: GPIO4 
  enable_pin: GP IO33
  sda_pin: GPIO0
  s cl_pin: GPIO1


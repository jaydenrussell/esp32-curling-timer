# =====================================================================
# OPTIONAL Wi-Fi add-on package — ESP32-C6 SDIO co-processor
#
# Enable in curling-timer.yaml after the SuperMini C6 is wired to the
# U213 SDIO header (docs/wiring-U213.md) and flashed with
# network_adapter.bin (docs/flash-c6.md):
#
# packages:
#   wifi_addon: !include wifi-c6-failover.yaml
# =====================================================================

esp32_hosted:
  variant: ESP32C6
  type: sdio
  bus_width: 1     # SuperMini is headerless on C6 D1-D3 (GPIO21-23) — 1-bit SDIO needs only CLK/CMD/D0
  clk_pin: GPIO40  # Hat2-Bus pin 10 (C6 GPIO19, SDIO_CLK)
  cmd_pin: GPIO39  # Hat2-Bus pin 12 (C6 GPIO18, SDIO_CMD)
  d0_pin: GPIO41   # Hat2-Bus pin 8  (C6 GPIO20, SDIO_D0)
  # 20MHz through flying wires + GPIO matrix; raise to 40MHz once stable
  sdio_frequency: 20MHz
  active_high: true
  reset_pin: GPIO27  # C6 EN via SDIO-Bus pin 7 (USB1_DP); wire later, NC is harmless
  use_psram: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Curling-Timer-Setup"
    password: !secret ap_password

binary_sensor:
  - platform: template
    name: "Wi-Fi Connected"
    id: wifi_up
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return wifi::global_wifi_component->is_connected();

text_sensor:
  - platform: template
    name: "Active Link"
    id: active_link
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      if (ethernet::global_eth_component->is_connected())
        return {"ethernet"};
      if (wifi::global_wifi_component->is_connected())
        return {"wifi"};
      return {"none"};

sensor:
  - platform: wifi_signal
    name: "Wi-Fi RSSI"
    update_interval: 30s

network:
  # ethernet is the default route; wifi (C6 SDIO co-processor) takes over on failover
  # Required since ESPHome 2026.9: both interfaces configured must set an order
  priority:
    - ethernet
    - wifi


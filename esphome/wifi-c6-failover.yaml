# =====================================================================
# OPTIONAL Wi-Fi add-on package — ESP32-C6 SDIO co-processor
#
# Enable in curling-timer.yaml after the SuperMini C6 is wired to the
# U213 SDIO header (docs/wiring-U213.md) and flashed with
# network_adapter.bin (docs/flash-c6.md):
#
# packages:
#   wifi_addon: !include wifi-c6-failover.yaml
# =====================================================================

esp32_hosted:
  variant: ESP32C6
  type: SDIO
  clk_pin: GPIO8    # C6 GPIO19 (SDIO_CLK)
  cmd_pin: GPIO9    # C6 GPIO18 (SDIO_CMD)
  d0_pin: GPIO10    # C6 GPIO20 (SDIO_D0)
  d1_pin: GPIO11    # C6 GPIO21 (SDIO_D1)
  d2_pin: GPIO12    # C6 GPIO22 (SDIO_D2)
  d3_pin: GPIO13    # C6 GPIO23 (SDIO_D3)
  use_psram: true

# Uncomment once the C6 EN pin is routed to a U213 GPIO (USB1_DP pad
# works when USB1 is unused) so the P4 can hard-reset a stuck C6:
#   reset_pin: GPIO27

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Curling-Timer-Setup"
    password: !secret ap_password

binary_sensor:
  - platform: template
    name: "Wi-Fi Connected"
    id: wifi_up
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return wifi::global_wifi_component->is_connected();

text_sensor:
  - platform: template
    name: "Active Link"
    id: active_link
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      if (ethernet::global_eth_component->is_connected())
        return {"ethernet"};
      if (wifi::global_wifi_component->is_connected())
        return {"wifi"};
      return {"none"};

sensor:
  - platform: wifi_signal
    name: "Wi-Fi RSSI"
    update_interval: 30s

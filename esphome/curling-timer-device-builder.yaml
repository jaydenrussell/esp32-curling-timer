# =====================================================================
# ESP32 Curling Timer
# For Home Assistant ESPHome Device Builder (paste-only, no repo checkout)
#
# This version uses a Git source so it can be pasted into the Device Builder
# without needing the external_components/ directory present. The git ref
# is tracked in component_ref.txt and should be updated when the component
# code changes (see AGENTS.md for details).
#
# For repo/CI builds use esphome/curling-timer.yaml instead (uses local source).
# =====================================================================

substitutions:
  # IANA timezone, e.g. "America/New_York" — see docs/BUILD.md
  timezone: "America/Toronto"

esphome:
  name: curling-timer
  friendly_name: Curling Timer
  name_add_mac_suffix: false

  esp32:
    variant: esp32p4
    watchdog_timeout: 60s
    engineering_sample: true
    cpu_frequency: 360MHz
    flash_size: 16MB
    flash_mode: qio
    flash_frequency: 60MHz
    framework:
      type: esp-idf
      sdkconfig_options:
        CONFIG_VFS_SUPPORT_DIR: y
        CONFIG_FATFS_LFN_HEAP: y
        CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
        CONFIG_SPIRAM_USE_MALLOC: y
        CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH: y
        CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF: y
        CONFIG_ESP_COREDUMP_CHECKSUM_CRC32: y
        CONFIG_HTTPD_MAX_REQ_HDR_LEN: "4096"
        CONFIG_HTTPD_MAX_URI_LEN: "1024"
        CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: y
      advanced:
        execute_from_psram: true
        loop_task_stack_size: 32768

  psram:
    speed: 100MHz

  safe_mode:
    disabled: true

  logger:
    hardware_uart: USB_SERIAL_JTAG
    level: INFO
    task_log_buffer_size: 8192

  select:
    - platform: logger
      name: "Log Level"
      id: log_level_select

  json:

network:
  ethernet:
    type: IP101
    phy_addr: 1
    mdc_pin: GPIO31
    mdio_pin: GPIO52
    power_pin: GPIO51
    clk:
      pin: GPIO50
      mode: CLK_EXT_IN

  mdns:
    id: mdns_advertiser

binary_sensor:
  - platform: template
    name: "Ethernet Connected"
    id: ethernet_up
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return ethernet::global_eth_component->is_connected();

  - platform: gpio
    pin:
      number: GPIO45
      mode: INPUT_PULLUP
    name: "Manual Trigger Button"
    id: manual_trigger_btn
    on_press:
      - lambda: id(engine).request_manual_trigger();

api:
  reboot_timeout: 0s
  encryption:
    key: !secret curling_timer__encryption_key

http_request:
  verify_ssl: true
  buffer_size_rx: 5120
  buffer_size_tx: 5120

ota:
  - platform: esphome
  - platform: web_server
    id: web_ota
  - platform: http_request
    id: http_ota

update:
  - platform: http_request
    name: "Firmware Update"
    id: firmware_update
    source: https://github.com/jaydenrussell/esp32-curling-timer/releases/latest/download/manifest.json
    update_interval: 6h

web_server:
  port: 80
  log: true
  auth:
    type: digest
    username: admin
    password: !secret webui_password

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    update_interval: 24h
    servers:
      - time.cloudflare.com
      - pool.ntp.org
    on_time_sync:
      then:
        - logger.log: "Time synchronized"

uart:
  - id: uart_addon
    tx_pin: GPIO37
    rx_pin:
      number: GPIO38
      mode: INPUT_PULLUP
    baud_rate: 115200

switch:
  - platform: gpio
    name: "Relay 1 (Bell)"
    id: relay_bell_ring
    pin: GPIO53
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relay 2 (Aux)"
    id: relay_aux
    pin: GPIO54
    restore_mode: ALWAYS_OFF

text_sensor:
  - platform: version
    name: "Firmware Version"

sensor:
  - platform: uptime
    name: "Uptime"

# ---------------------------------------------------------------------
# Schedule engine + web editor (external_components).
# ---------------------------------------------------------------------
external_components:
  - source:
      type: git
      url: https://github.com/jaydenrussell/esp32-curling-timer
      ref: v2026.11.175
      path: external_components   # required: ESPHome only auto-scans
                                   # components/ and esphome/components/
    components: [curling_engine, web_editor, lt8912b]
    refresh: 0s

curling_engine:
  id: engine
  store_path: /flash
  uart_id: uart_addon

web_editor:
  id: web_editor_comp
  password: !secret webui_password
  port: 8080

esp_ldo:
  - channel: 3
    voltage: 2.5V

lt8912b:
  id: hdmi
  reset_pin: GPIO4
  enable_pin: GPIO33
  sda_pin: GPIO0
  scl_pin: GPIO1

font:
  - file: "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf"
    id: font_timer_4
    size: 450
    glyphs: ["0123456789", "\u02F8"]
  - file: "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf"
    id: font_timer_5
    size: 370
    glyphs: ["0123456789", "\u02F8"]
  - file: "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf"
    id: font_header
    size: 96
    glyphsets: [GF_Latin_Kernel]
  - file: "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf"
    id: font_pace
    size: 85
    glyphsets: [GF_Latin_Kernel]
  - file: "https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf"
    id: font_footer
    size: 52
    glyphsets: [GF_Latin_Kernel]
    glyphs: ["\u02F8"]

globals:
  - id: g_snap
    type: ::esphome::curling_engine::DisplaySnapshot
    restore_value: no
  - id: pregame_blink_on
    type: bool
    restore_value: no
    initial_value: "true"


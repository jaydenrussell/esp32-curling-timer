name: ESPHome build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate dummy secrets for compile check
        run: cp esphome/secrets.yaml.example esphome/secrets.yaml
      - name: Compile curling-timer.yaml
        uses: esphome/build-action@v1.9.1
        with:
          yaml_file: esphome/curling-timer.yaml
          platform: esphome

name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create secrets
        run: cp esphome/secrets.yaml.example esphome/secrets.yaml

      - name: Install esphome
        run: pip install esphome

      - name: Patch ESPHome ranged download (GitHub CDN 504 workaround)
        run: |
          FH=$(python -c "import esphome.framework_helpers as fh; print(fh.__file__)")
          sed -i 's/ if offset else {}//' "$FH"
          grep -n 'headers = {"Range"' "$FH"

      - name: Validate config
        run: esphome config esphome/curling-timer.yaml

      - name: Compile
        run: esphome compile esphome/curling-timer.yaml

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esphome/.esphome/build/**/*.bin
            

name: build

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create secrets
        run: cp esphome/secrets.yaml.example esphome/secrets.yaml

      - name: Install esphome
        run: pip install esphome

      - name: Patch ESPHome ranged download (GitHub CDN 504 workaround)
        run: |
          python - <<'PY'
          from pathlib import Path
          p = None
          import site, esphome.framework_helpers as fh
          p = Path(fh.__file__)
          s = p.read_text()
          old = 'headers = {"Range": f"bytes={offset}-"} if offset else {}'
          new = 'headers = {"Range": f"bytes={offset}-"}'
          if old in s:
              p.write_text(s.replace(old, new))
              print("Patched " + str(p))
          else:
              print("Patch already applied or pattern not found in " + str(p))
          PY

      - name: Validate config
        run: esphome config esphome/curling-timer.yaml

      - name: Compile
        run: esphome compile esphome/curling-timer.yaml

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esphome/.esphome/build/**/*.bin
            

name: build

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update firmware_version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^  firmware_version:.*/  firmware_version: \"$VERSION\"/" esphome/curling-timer.ha.yaml
          if [ -f esphome/component_ref.txt ]; then echo "$VERSION" > esphome/component_ref.txt; fi

      - name: Create secrets
        run: cp esphome/secrets.yaml.example esphome/secrets.yaml

      - name: Install esphome
        run: pip install esphome

      - name: Validate config
        run: esphome config esphome/curling-timer.ha.yaml

      - name: Compile
        run: esphome compile esphome/curling-timer.ha.yaml

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esphome/.esphome/build/curling-timer/firmware.factory.bin
            esphome/.esphome/build/curling-timer/firmware.ota.bin

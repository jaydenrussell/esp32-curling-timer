name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate dummy secrets for compile check
        run: cp esphome/secrets.yaml.example esphome/secrets.yaml
      - name: Compile curling-timer.yaml
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: esphome/curling-timer.yaml
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}
          files: |
            esphome/.esphome/build/curling-timer/build/firmware.factory.bin
            esphome/.esphome/build/curling-timer/build/firmware.ota.bin

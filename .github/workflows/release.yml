name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Generate secrets.yaml from GitHub Actions secrets (hard requirement)
        env:
          # The API/OTA encryption key may be stored under either name; the
          # step picks whichever is valid 32-byte base64.
          API_ENCRYPTION_KEY: ${{ secrets.API_ENCRYPTION_KEY }}
          CURLING_TIMER__ENCRYPTION_KEY: ${{ secrets.CURLING_TIMER__ENCRYPTION_KEY }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          AP_PASSWORD: ${{ secrets.AP_PASSWORD }}
        run: |
          for v in API_ENCRYPTION_KEY CURLING_TIMER__ENCRYPTION_KEY WEB_PASSWORD WIFI_SSID WIFI_PASSWORD AP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "$v: EMPTY"; else echo "$v: set (len ${#v})"; fi
          done
          python3 - <<'PY'
          import os, sys, yaml, base64
          # YAML !secret key -> list of candidate Actions secret names (first
          # non-empty wins; for the encryption key the first VALID one wins).
          keys = {
              'curling_timer__encryption_key': ['API_ENCRYPTION_KEY', 'CURLING_TIMER__ENCRYPTION_KEY'],
              'web_password': ['WEB_PASSWORD'],
              'wifi_ssid': ['WIFI_SSID'],
              'wifi_password': ['WIFI_PASSWORD'],
              'ap_password': ['AP_PASSWORD'],
          }
          def clean(env):
              return ''.join(os.environ.get(env, '').split())  # strip whitespace/newlines
          data = {}
          missing = []
          for key, candidates in keys.items():
              val = ''
              for env in candidates:
                  v = clean(env)
                  if not v:
                      continue
                  if key == 'curling_timer__encryption_key':
                      try:
                          if len(base64.b64decode(v, validate=True)) == 32:
                              val = v; break
                      except Exception:
                          continue
                  else:
                      val = v; break
              if not val:
                  missing.append(f'{key} (secrets: {", ".join(candidates)})')
                  continue
              data[key] = val
          if missing:
              print('FATAL: missing/invalid required secrets: ' + ', '.join(missing), file=sys.stderr)
              print('For curling_timer__encryption_key use `openssl rand -base64 32` (44 chars, decodes to 32 bytes);', file=sys.stderr)
              print('store it as repository secret API_ENCRYPTION_KEY or CURLING_TIMER__ENCRYPTION_KEY.', file=sys.stderr)
              sys.exit(3)
          with open('esphome/secrets.yaml', 'w', encoding='utf-8') as f:
              yaml.safe_dump(data, f, default_flow_style=False, sort_keys=False)
          print(f'secrets.yaml written with {len(data)} real secrets (values not printed)')
          PY
          # secrets.yaml stays until after the compile below; the runner
          # checkout is ephemeral so it is never committed or uploaded
      - name: Compile curling-timer.ha.yaml
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: esphome/curling-timer.ha.yaml
      - name: Remove secrets.yaml from the runner (never uploaded)
        if: always()
        run: rm -f esphome/secrets.yaml
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: Release ${{ github.ref_name }} (built with production secrets)
          files: |
            esphome/.esphome/build/curling-timer.ha/build/firmware.factory.bin
            esphome/.esphome/build/curling-timer.ha/build/firmware.ota.bin

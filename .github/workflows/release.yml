name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose action secrets (names only, never values)
        env:
          SECRETS_ENCRYPTION_KEY: ${{ secrets.CURLING_TIMER__ENCRYPTION_KEY }}
          SECRETS_WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
          SECRETS_WIFI_SSID: ${{ secrets.WIFI_SSID }}
          SECRETS_WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          SECRETS_AP_PASSWORD: ${{ secrets.AP_PASSWORD }}
        run: |
          for v in SECRETS_ENCRYPTION_KEY SECRETS_WEB_PASSWORD SECRETS_WIFI_SSID SECRETS_WIFI_PASSWORD SECRETS_AP_PASSWORD; do
            if [ -n "${!v}" ]; then echo "$v: set (len ${#v})"; else echo "$v: EMPTY"; fi
          done
      - name: Generate secrets.yaml from GitHub Actions secrets
        env:
          SECRETS_ENCRYPTION_KEY: ${{ secrets.CURLING_TIMER__ENCRYPTION_KEY }}
          SECRETS_WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
          SECRETS_WIFI_SSID: ${{ secrets.WIFI_SSID }}
          SECRETS_WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          SECRETS_AP_PASSWORD: ${{ secrets.AP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, yaml, base64
          example = 'esphome/secrets.yaml.example'
          with open(example, encoding='utf-8') as f:
              data = yaml.safe_load(f)
          envmap = {
              'curling_timer__encryption_key': 'SECRETS_ENCRYPTION_KEY',
              'web_password': 'SECRETS_WEB_PASSWORD',
              'wifi_ssid': 'SECRETS_WIFI_SSID',
              'wifi_password': 'SECRETS_WIFI_PASSWORD',
              'ap_password': 'SECRETS_AP_PASSWORD',
          }
          real, dummy = [], []
          for key, env in envmap.items():
              # secrets often carry a trailing newline; strip all whitespace
              val = ''.join(os.environ.get(env, '').split())
              if not val:
                  dummy.append(key)
                  print(f'{key}: EMPTY -> keeping placeholder')
                  continue
              if key == 'curling_timer__encryption_key':
                  try:
                      raw = base64.b64decode(val, validate=True)
                      if len(raw) != 32:
                          raise ValueError(f'decodes to {len(raw)} bytes, need 32')
                  except Exception as e:
                      dummy.append(key)
                      print(f'{key}: invalid base64/32-byte key ({e}) -> keeping placeholder')
                      continue
              real.append(key)
              data[key] = val  # yaml.dump quotes/escapes safely, unlike regex replace
          with open('esphome/secrets.yaml', 'w', encoding='utf-8') as f:
              yaml.safe_dump(data, f, default_flow_style=False, sort_keys=False)
          with open('secrets_status.txt', 'w') as f:
              f.write('REAL\n' if not dummy else 'DUMMY: ' + ','.join(dummy) + '\n')
          print('secrets.yaml written; real=', real, 'dummy=', dummy, '(values not printed)')
          PY
          # secrets.yaml stays until after the compile below; the runner
          # checkout is ephemeral so it is never committed or uploaded
      - name: Compile curling-timer.ha.yaml
        uses: esphome/build-action@v8.1.0
        with:
          yaml-file: esphome/curling-timer.ha.yaml
      - name: Remove secrets.yaml from the runner (never uploaded)
        if: always()
        run: rm -f esphome/secrets.yaml
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}
            Secrets status: $(cat secrets_status.txt 2>/dev/null || echo unknown)
            $([ -f secrets_status.txt ] && grep -q '^DUMMY' secrets_status.txt && echo '

            ⚠️ **DUMMY SECRETS** — this image was built with placeholder secrets because
            the GitHub Actions secrets were not visible to the job. **Not for production.**
            Set repository secrets named SECRETS_ENCRYPTION_KEY, SECRETS_WEB_PASSWORD,
            SECRETS_WIFI_SSID, SECRETS_WIFI_PASSWORD, SECRETS_AP_PASSWORD
            (repo → Settings → Secrets and variables → Actions → Repository secrets).')
          files: |
            esphome/.esphome/build/curling-timer.ha/build/firmware.factory.bin
            esphome/.esphome/build/curling-timer.ha/build/firmware.ota.bin
